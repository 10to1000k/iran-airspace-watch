# مرحله ۲ — اجرای بات + بیدارنگه‌دارنده‌ی خودکار (ضد Idler دوازده‌ساعته‌ی OpenShift Sandbox)
#
# __IMAGE__ را deploy.sh / deploy.ps1 پر می‌کند. مقدارش:
#   image-registry.openshift-image-registry.svc:5000/<namespace>/iran-airspace-watch:latest
#
# سکرت با این دستور ساخته می‌شود (اسکریپت خودش انجام می‌دهد):
#   oc create secret generic airwatch-secrets --from-env-file=.env
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airwatch
  labels:
    app: airwatch
spec:
  replicas: 1
  # SQLite و getUpdates اجازه‌ی بیش از یک نمونه نمی‌دهند
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airwatch
  template:
    metadata:
      labels:
        app: airwatch
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: bot
          image: __IMAGE__
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: airwatch-secrets
          env:
            - name: HEALTH_PORT
              value: "8080"
            - name: TZ
              value: Asia/Tehran
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 45
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: airwatch-data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airwatch-keepalive
  labels:
    app: airwatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airwatch-keepalive
  labels:
    app: airwatch
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airwatch-keepalive
  labels:
    app: airwatch
subjects:
  - kind: ServiceAccount
    name: airwatch-keepalive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airwatch-keepalive
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: airwatch-keepalive
  labels:
    app: airwatch
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      activeDeadlineSeconds: 60
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: airwatch-keepalive
        spec:
          serviceAccountName: airwatch-keepalive
          restartPolicy: Never
          containers:
            - name: keepalive
              image: __IMAGE__
              imagePullPolicy: IfNotPresent
              command: ["python", "run.py", "--keepalive"]
              env:
                - name: KEEPALIVE_DEPLOYMENT
                  value: airwatch
                - name: KEEPALIVE_APP_LABEL
                  value: airwatch
              resources:
                requests:
                  cpu: 10m
                  memory: 48Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
