    - persian gulf
    - "strait of hormuz"
    - hormuz
    - خاورمیانه
    - خلیج فارس
    - تنگه هرمز
    - hürmüz
    - orta doğu
    - "ближний восток"
    - "персидский залив"
    - "الشرق الأوسط"
    - "الخليج العربي"
    - "مضيق هرمز"
    - 中东
    - 波斯湾
    - 霍尔木兹
  # قانون منطقه فقط با این عبارت‌ها فعال می‌شود — نه با «airline» یا «airport».
  # بدون این محدودیت، هر خبر ایرلاین در خاورمیانه مثبت کاذب می‌شود
  # (مثلاً «Qatar Airways to fly to Western Sydney airport»).
