app:
  name: Iran Airspace Watch
  display_timezone: Asia/Tehran
  # پنجره‌ی خوشه‌بندی: خبرهای هم‌موضوع در این بازه به یک رخداد وصل می‌شوند
  dedupe_window_hours: 6
  # آستانه‌ی شباهت متنی برای یکسان‌دانستن دو خبر
  similarity_threshold: 0.72
  # اگر ایرلاین/فرودگاه مشترک باشد، آستانه پایین‌تر می‌آید
  entity_boost_threshold: 0.45
  # حداکثر طول متن خروجی (تلگرام ۴۰۹۶ کاراکتر)
  max_body_chars: 700

poll:
  rss_seconds: 75
  notam_seconds: 60
  x_seconds: 90
  telegram_queue_seconds: 10
  # فقط آیتم‌های تازه‌تر از این بازه پردازش می‌شوند (جلوگیری از سیل اولیه)
  max_item_age_hours: 12
  max_items_per_feed: 15
  x_max_queries: 5
  # صفحه‌های چرخشی و آرشیوی «خبر واحد» نیستند: با هر به‌روزرسانی دوباره ثبت
  # می‌شوند و متن‌شان آن‌قدر متنوع است که تقریباً هر فیلتری را رد می‌کند.
  skip_url_parts:
    - /live-blog
    - /liveblog
    - /live/
    - /blog/
    - /tag/
    - /topic/
    - /author/

# ── NOTAM ────────────────────────────────────────────────────
# کالکتور NOTAM سازمان هوانوردی آمریکا (FAA) کنار گذاشته شده است: کلید API
# نیاز داشت و کاربر آن را نخواست. کد باقی مانده تا در آینده با منبع دیگری
# (مثلاً فید عمومی NASA DIP یا RSS) جایگزین شود؛ فعلاً خاموش است.
notam:
  enabled: false

notifications:
  # فقط این شدت‌ها با صدا می‌روند؛ بقیه بی‌صدا ولی همان لحظه
  loud_severities: [critical]
  silent_others: true
  include_feedback_buttons: true

# سرور سلامت برای probeهای OpenShift. اگر حلقه‌ی اصلی کد بخوابد،
# k8s خودش pod را ری‌استارت می‌کند.
health:
  enabled: true
  port: 8080
  stale_seconds: 120

# ── فیلتر ربط ────────────────────────────────────────────────
# یک آیتم باید هم به ایران اشاره کند و هم زمینه‌ی هوانوردی داشته باشد.
# فقط «ایران» کافی نیست، وگرنه خبر ورزشی و شهری هم رد می‌شود.
relevance:
  airport_codes: [OIIE, OIII, OIIX, IKA, THR]
  # فقط همین مقدار از متن برای سنجش ربط بررسی می‌شود. صفحه‌های بسیار بلند
  # (لایووبلاگ، گزارش جامع) به‌طور تصادفی کلمه‌ی ایران و هوانوردی را کنار هم دارند.
  max_match_chars: 1200
  keywords:
    # فقط نام‌ها و مکان‌های ایران. اصطلاحات هوانوردی جای دیگری هستند؛
    # وگرنه هر خبر «حریم هوایی» در دنیا به ایران وصل می‌شود.
    fa: [ایران, ایرانی, تهران, مهرآباد, "امام خمینی"]
    en: [iran, iranian, tehran, mehrabad, "imam khomeini", "fir tehran", "tehran fir"]
    tr: [iran, tahran, mehrabad, "imam humeyni"]
    ru: [иран, тегеран, мехрабад, "имам хомейни"]
    ar: [إيران, ايران, طهران, مهرآباد, "الإمام الخميني"]
    zh: [伊朗, 德黑兰, 梅赫拉巴德, 伊玛目霍梅尼]
  aviation_keywords:
    - flight
    - flights
    - airline
    - airlines
    - airport
    - airports
    - airspace
    - notam
    - fir
    - runway
    - aircraft
    - aviation
    - overflight
    - passenger
    - پرواز
    - هواپیمایی
    - هواپیما
    - فرودگاه
    - باند
    - حریم هوایی
    - مسافر
    - uçuş
    - havayolu
    - havalimanı
    - "hava sahası"
    - авиа
    - рейс
    - самолет
    - аэропорт
    - воздушн
    - طيران
    - رحلة
    - مطار
    - "المجال الجوي"
    - 航班
    - 航空
    - 机场
    - 领空
  # عبارت‌های فنی که به‌تنهایی برای تأیید ربط کافی‌اند.
  # «پرواز» تنها ضعیف است (خبر ورزشی: «پرواز تیم ملی به فینال»).
  strong_aviation_keywords:
    - airline
    - airlines
    - airports
    - airspace
    - notam
    - fir
    - runway
    - aircraft
    - aviation
    - overflight
    - "ground stop"
    - "air force"
    - airbase
    - "air base"
    - "no-fly zone"
    - "cancel flights"
    - "flights cancelled"
    - "flights suspended"
    - "flights canceled"
    - فرودگاه
    - هواپیمایی
    - هواپیما
    - باند
    - حریم هوایی
    - "لغو پرواز"
    - "لغو پروازها"
    - "تأخیر پرواز"
    - havayolu
    - havalimanı
    - "hava sahası"
    - авиакомпания
    - аэропорт
    - самолет
    - "рейсы отменены"
    - طيران
    - مطار
    - "المجال الجوي"
    - 航空
    - 机场
    - 领空
  # عبارت‌های منطقه‌ای: «امارات پروازهای خاورمیانه را متوقف کرد»
  # عمداً «gulf» تنها نیست: با «Gulf Air» و «Gulfstream» قاطی می‌شود.
  region_keywords:
    - middle east
    - persian gulf
    - "strait of hormuz"
    - hormuz
    - خاورمیانه
    - خلیج فارس
    - تنگه هرمز
    - hürmüz
    - orta doğu
    - "ближний восток"
    - "персидский залив"
    - "الشرق الأوسط"
    - "الخليج العربي"
    - "مضيق هرمز"
    - 中东
    - 波斯湾
    - 霍尔木兹
  # قانون منطقه فقط با این عبارت‌ها فعال می‌شود — نه با «airline» یا «airport».
  # بدون این محدودیت، هر خبر ایرلاین در خاورمیانه مثبت کاذب می‌شود
  # (مثلاً «Qatar Airways to fly to Western Sydney airport»).
  airspace_signal_keywords:
    - airspace
    - "air space"
    - notam
    - fir
    - overflight
    - "air corridor"
    - reroute
    - rerouted
    - diverted
    - "no-fly zone"
    - "ground stop"
    - "airspace closed"
    - "closed airspace"
    - "closure of airspace"
    - "flights suspended"
    - "flights cancelled"
    - "flights canceled"
    - "suspends flights"
    - "cancels flights"
    - "canceled flights"
    - "cancelled flights"
    - حریم هوایی
    - "بستن حریم"
    - "لغو پرواز"
    - "لغو پروازها"
    - "تغییر مسیر"
    - "مسیر پرواز"
    - hava sahası
    - "uçuşlar iptal"
    - "воздушное пространство"
    - "рейсы отменены"
    - "المجال الجوي"
    - "إلغاء الرحلات"
    - 领空
    - 航班取消

  # اگر true شود، خبرهای «ایران + جنگ/حمله/موشک/تحریم» هم به‌عنوان «زمینه»
  # منتشر می‌شوند. پیش‌فرض خاموش است، چون حجمشان زیاد و ربطشان غیرمستقیم است.
  include_iran_conflict_context: false
  conflict_keywords:
    - war
    - strike
    - missile
    - attack
    - military
    - sanctions
    - hormuz
    - جنگ
    - حمله
    - موشک
    - نظامی
    - تحریم
    - هرمز
    - война
    - удар
    - ракет
    - санкции
    - savaş
    - füze
    - حرب
    - صاروخ
    - 战争
    - 导弹

