app:
  name: Iran Airspace Watch
  display_timezone: Asia/Tehran
  # پنجره‌ی خوشه‌بندی: خبرهای هم‌موضوع در این بازه به یک رخداد وصل می‌شوند
  dedupe_window_hours: 6
  # آستانه‌ی شباهت متنی برای یکسان‌دانستن دو خبر
  similarity_threshold: 0.72
  # اگر ایرلاین/فرودگاه مشترک باشد، آستانه پایین‌تر می‌آید
  entity_boost_threshold: 0.45
  # حداکثر طول متن خروجی (تلگرام ۴۰۹۶ کاراکتر)
  max_body_chars: 700
  # سقف متنی که برای ترجمه به LLM داده می‌شود (هزینه‌ی توکن؛ پیام منتشرشده
  # در هر حال تا max_body_chars بریده می‌شود)
  max_translate_chars: 4000
  # نگه‌داری آیتم‌های خام در دیتابیس (پاک‌سازی خودکار روزانه)
  retention_days: 30

poll:
  rss_seconds: 75
  rss_workers: 6
  notam_seconds: 60
  x_seconds: 90
  telegram_queue_seconds: 10
  # فقط آیتم‌های تازه‌تر از این بازه پردازش می‌شوند (جلوگیری از سیل اولیه)
  max_item_age_hours: 12
  max_items_per_feed: 15
  x_max_queries: 5
  # صفحه‌های چرخشی و آرشیوی «خبر واحد» نیستند: با هر به‌روزرسانی دوباره ثبت
  # می‌شوند و متن‌شان آن‌قدر متنوع است که تقریباً هر فیلتری را رد می‌کند.
  # نکته: «/blog/» نباید اینجا باشد چون Flightradar24 و OPSGROUP زیر /blog/ مقاله منتشر می‌کنند.
  skip_url_parts:
    - /live-blog
    - /liveblog
    - /live/
    - /tag/
    - /topic/
    - /author/

  # ── سقف بدنه (body caps) برای هر کالکتور ──────────────────
  # طول متن خامی که از هر منبع ذخیره/پردازش می‌شود؛ خروجی منتشرشده جداگانه
  # با app.max_body_chars سقف می‌خورد.
  max_feed_body_chars: 1200
  max_telegram_body_chars: 1200
  max_x_body_chars: 1000
  max_instagram_body_chars: 2200

  # ── متن کامل مقاله ────────────────────────────────────────
  # اگر خلاصه‌ی فید کوتاه یا بریده («…») باشد، متن کامل از لینک خبر گرفته
  # می‌شود تا دسته‌بندی، خوشه‌بندی و ترجمه کل مقاله را ببینند. هر خطا بی‌صدا
  # رد می‌شود و خبر با همان خلاصه ادامه می‌یابد.
  fetch_full_article: true
  article_max_chars: 6000
  article_timeout_seconds: 10
  # خلاصه‌های بلندتر از این را کامل فرض کن و دنبال مقاله نرو (حجم/سرعت)
  article_min_summary_chars: 400

# ── NOTAM ────────────────────────────────────────────────────
# کالکتور NOTAM سازمان هوانوردی آمریکا (FAA) کنار گذاشته شده است: کلید API
# نیاز داشت و کاربر آن را نخواست. کد باقی مانده تا در آینده با منبع دیگری
# (مثلاً فید عمومی NASA DIP یا RSS) جایگزین شود؛ فعلاً خاموش است.
notam:
  enabled: false

# ── پایش هشتگ (تلگرام / X / اینستاگرام) ─────────────────────
# این هشتگ‌ها در پیام‌های کانال‌های تلگرام و توییت‌های X دنبال می‌شوند، یک
# کوئری هشتگی به جست‌وجوی X اضافه می‌کنند و (اگر ENABLE_INSTAGRAM=true باشد)
# جست‌وجوی هشتگی اینستاگرام هم روی همین فهرست می‌رود.
# کالکتورها فقط هشتگ‌های این فهرست را به‌عنوان «سیگنال» به فیلتر ربط تزریق
# می‌کنند؛ #TehranFIR به «Tehran FIR» باز می‌شود تا مثل خبر عادی سنجیده شود.
hashtags:
  enabled: true
  watchlist:
    - TehranFIR
    - IranAirspace
    - OIIE
    - OIII
    - OIIX
    - IranAir
    - MahanAir
  instagram:
    # فعال‌سازی فقط با ENABLE_INSTAGRAM=true (+ اختیاری: INSTAGRAM_USERNAME/PASSWORD)
    # ⚠️ اسکرپینگ اینستاگرام خلاف شرایط سرویس است؛ مسئولیت با فعال‌کننده است.
    seconds: 900
    max_posts_per_tag: 12
    # زبان کپشن‌های اینستاگرام برای مسیر مترجم؛ «en» یعنی حتماً ترجمه شود
    lang: en

notifications:
  # فقط این شدت‌ها با صدا می‌روند؛ بقیه بی‌صدا ولی همان لحظه
  loud_severities: [critical]
  silent_others: true
  include_feedback_buttons: true

# سرور سلامت برای probeهای OpenShift. اگر حلقه‌ی اصلی، کالکتورها یا نخ تلگرام
# قفل شوند، k8s خودش pod را ری‌استارت می‌کند.
health:
  enabled: true
  port: 8080
  stale_seconds: 300

# ── فیلتر ربط ────────────────────────────────────────────────
# یک آیتم باید هم به ایران اشاره کند و هم زمینه‌ی هوانوردی داشته باشد.
# فقط «ایران» کافی نیست، وگرنه خبر ورزشی و شهری هم رد می‌شود.
relevance:
  airport_codes: [OIIE, OIII, OIIX, IKA, THR]
  # فقط همین مقدار از متن برای سنجش ربط بررسی می‌شود. صفحه‌های بسیار بلند
  # (لایووبلاگ، گزارش جامع) به‌طور تصادفی کلمه‌ی ایران و هوانوردی را کنار هم دارند.
  max_match_chars: 1200
  keywords:
    # فقط نام‌ها و مکان‌های ایران. اصطلاحات هوانوردی جای دیگری هستند؛
    # وگرنه هر خبر «حریم هوایی» در دنیا به ایران وصل می‌شود.
    fa: [ایران, ایرانی, تهران, مهرآباد, "امام خمینی"]
    en: [iran, iranian, tehran, mehrabad, "imam khomeini", "fir tehran", "tehran fir"]
    tr: [iran, tahran, mehrabad, "imam humeyni"]
    ru: [иран, тегеран, мехрабад, "имам хомейни"]
    ar: [إيران, ايران, طهران, مهرآباد, "الإمام الخميني"]
    zh: [伊朗, 德黑兰, 梅赫拉巴德, 伊玛目霍梅尼]
  aviation_keywords:
    - flight
    - flights
    - airline
    - airlines
    - airport
    - airports
    - airspace
    - notam
    - fir
    - runway
    - aircraft
    - aviation
    - overflight
    - passenger
    - پرواز
    - هواپیمایی
    - هواپیما
    - فرودگاه
    - باند
    - حریم هوایی
    - مسافر
    - uçuş
    - havayolu
    - havalimanı
    - "hava sahası"
    - авиа
    - рейс
    - самолет
    - аэропорт
    - воздушн
    - طيران
    - رحلة
    - مطار
    - "المجال الجوي"
    - 航班
    - 航空
    - 机场
    - 领空
  # عبارت‌های فنی که به‌تنهایی برای تأیید ربط کافی‌اند.
  # «پرواز» تنها ضعیف است (خبر ورزشی: «پرواز تیم ملی به فینال»).
  strong_aviation_keywords:
    - airline
    - airlines
    - airports
    - airspace
    - notam
    - fir
    - runway
    - aircraft
    - aviation
    - overflight
    - "ground stop"
    - "air force"
    - airbase
    - "air base"
    - "no-fly zone"
    - "cancel flights"
    - "flights cancelled"
    - "flights suspended"
    - "flights canceled"
    - فرودگاه
    - هواپیمایی
    - هواپیما
    - باند
    - حریم هوایی
    - "لغو پرواز"
    - "لغو پروازها"
    - "تأخیر پرواز"
    - havayolu
    - havalimanı
    - "hava sahası"
    - sefer
    - seferler
    - seferlerini
    - iptal
    - uçuş
    - uçuşlar
    - авиакомпания
    - аэропорт
    - самолет
    - "рейсы отменены"
    - طيران
    - مطار
    - "المجال الجوي"
    - 航空
    - 机场
    - 领空
  # عبارت‌های منطقه‌ای: «امارات پروازهای خاورمیانه را متوقف کرد»
  # عمداً «gulf» تنها نیست: با «Gulf Air» و «Gulfstream» قاطی می‌شود.
