    - "flights cancelled"
    - "flights canceled"
    - "suspends flights"
    - "cancels flights"
    - "canceled flights"
    - "cancelled flights"
    - حریم هوایی
    - "بستن حریم"
    - "لغو پرواز"
    - "لغو پروازها"
    - "تغییر مسیر"
    - "مسیر پرواز"
    - hava sahası
    - "uçuşlar iptal"
    - iptal
    - sefer
    - seferler
    - seferlerini
