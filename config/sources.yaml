# هشتگ‌های پلتفرم‌ها (تلگرام و X): جفت «ایران + هوانوردی» در یک پست کوتاه
# نشانه‌ی موضوع اصلی است و در طبقه‌بند امتیاز ارسال می‌گیرد. در جست‌وجوی X هم
# از همین فهرست کوئری ساخته می‌شود (XCollector). هشتگ تازه را همین‌جا اضافه کن.
hashtags:
  # ترکیب‌های هدفمند ایران+هوانوردی، به‌عنوان سیگنال جست‌وجوی شبکه‌های اجتماعی
  iran: ["#Iran", "#Tehran", "#ایران", "#تهران", "#حریم_هوایی", "#IranAirspace", "#IranFlights", "#FlightsToIran", "#پرواز_به_ایران", "#حریم_هوایی_ایران", "#TehranFIR", "#ImamKhomeiniAirport", "#MehrabadAirport", "#فرودگاه_امام_خمینی", "#فرودگاه_مهرآباد", "#پرواز_تهران"]
  aviation: ["#NOTAM", "#TehranFIR", "#OIIX", "#OIIE", "#OIII", "#IKA", "#aviation", "#airspace", "#پرواز", "#فرودگاه", "#مهرآباد", "#IranAirspace", "#IranFlights", "#FlightsToIran", "#پرواز_به_ایران", "#حریم_هوایی_ایران", "#ImamKhomeiniAirport", "#MehrabadAirport", "#فرودگاه_امام_خمینی", "#فرودگاه_مهرآباد", "#پرواز_تهران"]

# منابع متن‌باز بدون کلید:
# - GDELT (پروژه‌ی متن‌باز پایش اخبار جهان): کالکتورش در src/collectors.py است و
#   با gdelt.enabled در settings.yaml روشن می‌شود؛ کلید نمی‌خواهد.
# - RSSHub (متن‌باز): اگر جایی هاستش کردی، خروجی هر روتش را مثل یک منبع rss
#   معمولی به فهرست بالا اضافه کن (مثلاً روت‌های توییتر/تلگرام عمومی).

# کانال‌های تلگرامی — پایش لحظه‌ای (اختیاری):
# نیاز به ENABLE_TELEGRAM_CHANNELS=true + TELEGRAM_API_ID/HASH + یک‌بار لاگین سشن (کالکتور telethon). پیام‌ها لحظه‌ای می‌رسند و برای کانال خصوصی لازم است.
# نکته: پیش‌نویس وب t.me/s بدون لاگین خالی است (تلگرام با جاوااسکریپت رندر می‌شود) و از آن استفاده نشده است.
#  2) رویدادمحور: کالکتور telethon با ENABLE_TELEGRAM_CHANNELS=true + TELEGRAM_API_ID/HASH
#     + سشن لاگین — پیام‌ها لحظه‌ای می‌رسند و برای کانال خصوصی لازم است.
# قواعد: id با tg_ شروع و یکتا باشد؛ lang = زبان غالب کانال (fa/en) برای مسیر صحیح مترجم.
telegram_channels:
  - {id: tg_example, name: "نمونه", username: "", enabled: false}
  # نمونه‌ی واقعی (کافیست enabled را true کنید):
  # - {id: tg_aviationbrk, name: "AviationBRK", username: "aviationbrk", enabled: true, lang: en}
