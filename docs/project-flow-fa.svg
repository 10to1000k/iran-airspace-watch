<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">نقشهٔ جریان پروژهٔ پایش هوایی ایران</title>
<desc id="desc">دیاگرام مسیر گردآوری خبر تا فیلتر، دسته‌بندی، ترجمه و ارسال در تلگرام.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#101f38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#67e8f9"/></marker>
  <style>
    .fa{font-family:Tahoma,Arial,sans-serif;fill:#edf5ff;direction:rtl;unicode-bidi:plaintext}
    .title{font-size:38px;font-weight:700}.subtitle{font-size:18px;fill:#9fb3ca}
    .head{font-size:21px;font-weight:700}.body{font-size:16px;fill:#c4d2e3}.small{font-size:14px;fill:#9fb3ca}
    .box{fill:#14243c;stroke:#2c4665;stroke-width:2;rx:18;filter:url(#shadow)}
    .source{fill:#122b3d;stroke:#1e8196}.proc{fill:#16253e;stroke:#536b92}.gate{fill:#2b2418;stroke:#d39c31}.out{fill:#142d32;stroke:#39a987}
    .line{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#arrow)}
    .mutedline{fill:none;stroke:#849ab5;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="1100" fill="url(#bg)"/>
<circle cx="130" cy="115" r="85" fill="#164e63" opacity=".18"/><circle cx="1480" cy="920" r="150" fill="#4338ca" opacity=".12"/>
<text x="800" y="72" text-anchor="middle" class="fa title">پروژه چطور کار می‌کند؟</text>
<text x="800" y="108" text-anchor="middle" class="fa subtitle">از دریافت خبر تا بررسی ربط، ترجمه و ارسال در تلگرام</text>

<!-- Sources -->
<text x="1420" y="165" text-anchor="end" class="fa head">۱ | منابع ورودی</text>
<rect x="1130" y="190" width="370" height="112" class="box source"/>
<text x="1465" y="226" text-anchor="end" class="fa head">فیدهای RSS خبرگزاری‌ها</text>
<text x="1465" y="258" text-anchor="end" class="fa body">ایرانی، خارجی و رسانه‌های هوانوردی</text>
<text x="1465" y="282" text-anchor="end" class="fa small">مثل مهر، ایرنا، مهرنيوز EN، TASS، Al Jazeera</text>
<rect x="1130" y="325" width="370" height="105" class="box source"/>
<text x="1465" y="362" text-anchor="end" class="fa head">GDELT</text>
<text x="1465" y="394" text-anchor="end" class="fa body">جست‌وجوی خبرهای وب با عبارت‌های هدفمند</text>
<rect x="1130" y="453" width="370" height="105" class="box source"/>
<text x="1465" y="489" text-anchor="end" class="fa head">شبکه‌های اجتماعی (اختیاری)</text>
<text x="1465" y="522" text-anchor="end" class="fa body">کانال تلگرام، X و اینستاگرام؛ نیازمند فعال‌سازی</text>

<!-- collection/enrich -->
<rect x="690" y="300" width="350" height="130" class="box proc"/>
<text x="865" y="342" text-anchor="middle" class="fa head">۲ | گردآوری و تکمیل</text>
<text x="865" y="375" text-anchor="middle" class="fa body">تیتر، خلاصه، زمان و لینک منبع</text>
<text x="865" y="405" text-anchor="middle" class="fa small">در صورت نیاز: واکشی متن کامل مقاله</text>
<path d="M1130 246 C1080 246 1090 330 1040 330" class="line"/><path d="M1130 377 H1040" class="line"/><path d="M1130 505 C1080 505 1090 410 1040 410" class="mutedline"/>

<!-- relevance gate -->
<path d="M510 265 H365 L290 365 L365 465 H510 L585 365 Z" class="gate" filter="url(#shadow)"/>
<text x="438" y="335" text-anchor="middle" class="fa head">۳ | فیلتر ربط</text>
<text x="438" y="368" text-anchor="middle" class="fa body">ایران / منطقه؟</text>
<text x="438" y="397" text-anchor="middle" class="fa body">نشانهٔ هوانوردی؟</text>
<text x="438" y="430" text-anchor="middle" class="fa small">خبر نامرتبط ← رد یا فقط ثبت</text>
<path d="M690 365 H580" class="line"/>

<!-- classify -->
<rect x="65" y="290" width="190" height="150" class="box proc"/>
<text x="160" y="330" text-anchor="middle" class="fa head">۴ | دسته‌بندی</text>
<text x="160" y="365" text-anchor="middle" class="fa body">حریم هوایی</text>
<text x="160" y="392" text-anchor="middle" class="fa body">فرودگاه / ایرلاین</text>
<text x="160" y="419" text-anchor="middle" class="fa small">شدت و اطمینان</text>
<path d="M290 365 H255" class="line"/>

<!-- lower flow -->
<rect x="1130" y="660" width="370" height="115" class="box proc"/>
<text x="1465" y="701" text-anchor="end" class="fa head">۵ | حذف تکرار و خوشه‌بندی</text>
<text x="1465" y="735" text-anchor="end" class="fa body">خبرهای یکسان به یک رخداد متصل می‌شوند</text>
<text x="1465" y="760" text-anchor="end" class="fa small">پنجرهٔ پیش‌فرض: ۶ ساعت</text>
<path d="M160 440 V717 H1130" class="line"/>

<rect x="690" y="635" width="350" height="165" class="box proc"/>
<text x="865" y="678" text-anchor="middle" class="fa head">۶ | ترجمه به فارسی</text>
<text x="865" y="712" text-anchor="middle" class="fa body">LLM با واژه‌نامهٔ تخصصی هوانوردی</text>
<text x="865" y="744" text-anchor="middle" class="fa small">Gemini ← Groq ← OpenRouter</text>
<text x="865" y="773" text-anchor="middle" class="fa small">اعتبارسنجی عددها؛ ترجمه ماشینی است</text>
<path d="M1130 718 H1040" class="line"/>

<rect x="245" y="640" width="300" height="155" class="box proc"/>
<text x="395" y="682" text-anchor="middle" class="fa head">۷ | ساخت پیام</text>
<text x="395" y="717" text-anchor="middle" class="fa body">خلاصه + منبع + لینک اصلی</text>
<text x="395" y="749" text-anchor="middle" class="fa body">برچسب اطمینان + هشتگ خودکار</text>
<text x="395" y="778" text-anchor="middle" class="fa small">هشتگ دسته/کشور، نه الزاماً از مقاله</text>
<path d="M690 718 H545" class="line"/>

<rect x="65" y="850" width="480" height="125" class="box out"/>
<text x="305" y="895" text-anchor="middle" class="fa head">۸ | ارسال به گفت‌وگوی تلگرام</text>
<text x="305" y="930" text-anchor="middle" class="fa body">پیام، لینک خبر و دکمه‌های بازخورد</text>
<text x="305" y="958" text-anchor="middle" class="fa small">/wrong برای گزارش خبر نامرتبط</text>
<path d="M395 795 V850" class="line"/>

<rect x="690" y="865" width="810" height="110" class="box"/>
<text x="1465" y="908" text-anchor="end" class="fa head">تنظیمات پروژه</text>
<text x="1465" y="943" text-anchor="end" class="fa body">config/sources.yaml: منابع و هشتگ‌های جست‌وجو  •  config/settings.yaml: فیلترها و کلیدواژه‌ها</text>
<text x="1465" y="968" text-anchor="end" class="fa small">src/classify.py: تصمیم ربط و دسته‌بندی  •  src/formatter.py: متن و هشتگ‌های پیام</text>

<rect x="65" y="1010" width="1435" height="48" rx="12" fill="#10233b" stroke="#314764"/>
<text x="782" y="1041" text-anchor="middle" class="fa small">نکته: خبرها از RSS/GDELT خودکار جمع می‌شوند؛ شبکه‌های اجتماعی فقط در صورت فعال‌سازی جداگانه وارد مسیر می‌شوند.</text>
</svg>