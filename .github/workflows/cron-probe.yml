# موقت: بررسی اینکه زمان‌بندی GitHub Actions در این مخزن کار می‌کند یا نه.
# بعد از تشخیص حذف می‌شود.
name: cron-probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: date -u
