# «ضربان» رایگان: اجرای یک چرخه‌ی کامل روی GitHub Actions
#
# چرا: Sandbox اوپن‌شیفت هر پاد را بعد از ۱۲ ساعت می‌خواباند و هر ۳۰ روز
# باید تمدید شود. این ورک‌فلو همان چرخه را بدون هیچ سروری اجرا می‌کند و
# دیتابیس را در برنچ `state` نگه می‌دارد، پس دِداپ و صف ارسال از دست نمی‌رود.
#
# فعال‌سازی (یک‌بار):
#   Settings → Secrets and variables → Actions → New repository secret
#     ENV_FILE = کل محتوای .env (شامل تلگرام، LLM و کوکی‌های X/Instagram)
#   بعد یک‌بار در تلگرام به بات /start بفرست. پالس بعدی خودش chat_id را
#   ثبت می‌کند؛ نیازی به نوشتن دستی شناسه نیست.
#
# نکته‌ها:
# - مخزن عمومی است؛ دقیقه‌های Actions نامحدود و رایگان‌اند.
# - RSS معمولی هر ۵ دقیقه اجرا می‌شود. مسیرهای X/Instagram هر ساعت
#   (`--due`) و فقط وقتی سررسیدند، همراه RSSHub بالا می‌آیند.
# - هر بار یک کامیت روی برنچ `state` می‌رود؛ همان «فعالیت» باعث می‌شود
#   GitHub زمان‌بندی را بعد از ۶۰ روز سکوت غیرفعال نکند.
# - برنچ main تمیز می‌ماند؛ دیتابیس فقط روی `state` است.
# - `--once --due` شنونده‌ی دائمی ندارد، ولی pending updateهای تلگرام را
#   یک‌بار می‌خواند؛ پس /start، /status و /last در پالس کار می‌کنند.

name: pulse

on:
  schedule:
    # GitHub حداقل ۵ دقیقه است و چند دقیقه جیتر دارد.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_social:
        description: "اجرای اجباری مسیرهای X/Instagram (RSSHub)"
        type: boolean
        default: false
  # کرون خارجی (مثلاً Cloudflare Worker) برای غلبه بر تأخیر/حذف زمانبندی
  # GitHub این رویداد را هر چند دقیقه میزند؛ پالس مثل اجرای عادی کار میکند.
  repository_dispatch:
    types: [airwatch-tick]

permissions:
  contents: write

# اگر اجرای قبلی هنوز تمام نشده، اجرای جدید صف می‌شود (SQLite و ارسال دوبل).
concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # گیرنده ثابت: اگر برنچ state ریست شد یا /start مصرف نشد، باز هم پیامها
    # به مقصد میرسند. load_dotenv مقدار محیط را overriding نمیکند، پس این
    # مقدار بر TELEGRAM_CHAT_ID خالیِ داخل .env برتری دارد.
    env:
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore state database
        run: |
          set -e
          mkdir -p data
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:data/watch.db > data/watch.db
            echo "state restored ($(stat -c%s data/watch.db) bytes)"
          else
            echo "no state branch yet; starting fresh"
          fi

      - name: Write .env from ENV_FILE
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -e
          if [ -z "$ENV_FILE" ]; then
            echo "::error::ENV_FILE secret is missing. Run: gh secret set ENV_FILE --body-file .env"
            exit 1
          fi
          # CRLF ویندوز در مقدار کوکی‌ها/توکن‌ها نشت نکند.
          printf '%s\n' "$ENV_FILE" | sed 's/\r$//' > .env
          chmod 600 .env

      - name: Install dependencies
        run: pip install -r requirements.txt telethon twscrape

      - name: Check whether hourly social routes are due
        id: due
        env:
          FORCE_SOCIAL: ${{ inputs.force_social }}
        run: |
          set -e
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os

          from src.airlines import AirlineIndex
          from src.collectors import build_jobs
          from src.config import load_config
          from src.db import Database
          from src.scheduler import job_due

          config = load_config()
          db = Database(config.db_path)
          try:
              jobs = build_jobs(
                  config, db, AirlineIndex(config.airlines), one_shot=True
              )
              social = next(
                  (job for job in jobs if job.name == "social_hashtags"), None
              )
              forced = os.getenv("FORCE_SOCIAL", "").lower() == "true"
              print(
                  f"social={'yes' if forced or (social and job_due(db, social)) else 'no'}"
              )
          finally:
              db.close()
          PY

      - name: Restore cached RSSHub images
        if: steps.due.outputs.social == 'yes'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rsshub-images
          key: rsshub-images-diygod-2026-11-05-redis-7-alpine

      - name: Load or pull RSSHub and Redis images
        if: steps.due.outputs.social == 'yes'
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/rsshub-images"
          if [ -f "$RUNNER_TEMP/rsshub-images/images.tar" ]; then
            echo "loading cached Docker images"
            docker load -i "$RUNNER_TEMP/rsshub-images/images.tar"
          else
            echo "pulling pinned RSSHub and Redis images"
            for attempt in 1 2 3; do
              if docker pull diygod/rsshub:2026-11-05 \
                && docker pull redis:7-alpine; then
                break
              fi
              echo "pull attempt $attempt failed; retrying in 10s"
              sleep 10
            done
            docker image inspect diygod/rsshub:2026-11-05 >/dev/null
            docker image inspect redis:7-alpine >/dev/null
            docker save diygod/rsshub:2026-11-05 redis:7-alpine \
              -o "$RUNNER_TEMP/rsshub-images/images.tar"
          fi

      - name: Start social feed hub
        if: steps.due.outputs.social == 'yes'
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/rsshub-patch"
          cp deploy/rsshub-boot.mjs "$RUNNER_TEMP/rsshub-patch/"
          cp deploy/instagram-tags-patch.mjs \
            "$RUNNER_TEMP/rsshub-patch/instagram-tags.mjs"

          # منابع در config/sources.yaml میزبان social-feed-hub را صدا می‌زنند.
          echo "127.0.0.1 social-feed-hub" | sudo tee -a /etc/hosts >/dev/null

          docker network create airwatch
          docker run -d --name airwatch-redis --network airwatch \
            redis:7-alpine \
            redis-server --save "" --appendonly no --dir /tmp
          # .env مقدار TELEGRAM_SESSION را برای Telethon روی مسیر فایل
          # (`data/telegram`) می‌گذارد، ولی RSSHub همان نام را رشته‌ی
          # StringSession می‌داند و با مقدار غیرخالی سراغ MTProto می‌رود؛
          # نتیجه ۵۰۳ برای همه‌ی کانال‌های تلگرام بود. برای RSSHub خالی
          # می‌کنیم تا از پیش‌نمایش عمومی t.me/s استفاده کند.
          docker run -d --name airwatch-rsshub --network airwatch \
            -p 127.0.0.1:1200:1200 \
            --env-file .env \
            -e TELEGRAM_SESSION= \
            -e NODE_ENV=production \
            -e CACHE_TYPE=redis \
            -e CACHE_EXPIRE=120 \
            -e REQUEST_RETRY=0 \
            -e 'REQUEST_RATE_LIMITS={"www.instagram.com":{"points":1,"duration":2}}' \
            -e REDIS_URL=redis://airwatch-redis:6379/ \
            -v "$RUNNER_TEMP/rsshub-patch:/patch:ro" \
            --entrypoint node \
            diygod/rsshub:2026-11-05 \
            --max-http-header-size=32768 /patch/rsshub-boot.mjs

          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 3 http://127.0.0.1:1200/ || true)
            code=${code:-000}
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              echo "RSSHub is ready (HTTP $code)"
              docker logs --tail 20 airwatch-rsshub
              exit 0
            fi
            sleep 2
          done
          echo "::error::RSSHub did not become ready"
          docker logs --tail 100 airwatch-rsshub || true
          exit 1

      - name: Run one collection cycle
        env:
          FORCE_SOCIAL: ${{ inputs.force_social }}
        run: |
          set -e
          if [ "$FORCE_SOCIAL" = "true" ]; then
            python run.py --once --due --force-social
          else
            python run.py --once --due
          fi

      - name: Save state database
        if: always()
        run: |
          set -e
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("data/watch.db")
          conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          conn.close()
          PY

          git config user.name "airwatch-pulse"
          git config user.email "actions@users.noreply.github.com"

          if git fetch --depth=1 origin state 2>/dev/null; then
            git worktree add .state FETCH_HEAD
            (cd .state && git checkout -B state)
            MODE=amend
          else
            git worktree add --detach .state HEAD
            (cd .state && git checkout --orphan state && git rm -r --cached -q .)
            MODE=new
          fi

          mkdir -p .state/data
          cp data/watch.db .state/data/watch.db
          # data/*.db در gitignore است، پس اجباری اضافه می‌شود.
          cd .state
          git add -f data/watch.db
          if [ "$MODE" = amend ]; then
            # یک کامیت ثابت: تاریخچه‌ی برنچ state رشد نمی‌کند.
            git commit --amend --no-edit --allow-empty
          else
            git commit -m "state: watch.db"
          fi
          git push --force origin state

      - name: Healthchecks ping (dead-man switch)
        if: always()
        env:
          HC_UUID: ${{ secrets.HEALTHCHECKS_UUID }}
          # fallback: از Variable هم می‌آید تا بدون Secret هم کار کند
          HC_UUID_VAR: ${{ vars.HEALTHCHECKS_UUID }}
        run: |
          set -e
          uuid="${HC_UUID:-$HC_UUID_VAR}"
          if [ -z "$uuid" ]; then
            echo "HEALTHCHECKS_UUID not set; skipping ping (create a free check at healthchecks.io, period 15m, grace 10m)"
            exit 0
          fi
          # /<uuid> = نجاح، /<uuid>/fail = شکست — healthchecks.io رایگان است.
          if [ "${{ job.status }}" = "success" ]; then
            curl -fsS "https://hc-ping.com/$uuid" || true
          else
            curl -fsS "https://hc-ping.com/$uuid/fail" || true
          fi
